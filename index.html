<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive quantum tunneling simulator for stationary electron scattering." />
  <title>Quantum Tunneling Explorer</title>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Introduction to Semiconductor · Quantum Scattering</p>
      <h1>Quantum Tunneling Explorer</h1>
      <p class="subtitle">Stationary-state scattering from a finite rectangular potential barrier.</p>
    </header>

    <section class="controls" aria-label="Simulation controls">
      <div class="control-group">
        <label for="energy">Electron Energy E: <span id="val-energy">5.0</span> eV</label>
        <input type="range" id="energy" min="1" max="20" step="0.1" value="5" />
      </div>

      <div class="control-group">
        <label for="height">Barrier Height V₀: <span id="val-height">10.0</span> eV</label>
        <input type="range" id="height" min="2" max="20" step="0.5" value="10" />
      </div>

      <div class="control-group">
        <label for="thickness">Barrier Width L: <span id="val-thickness">1.0</span> nm</label>
        <input type="range" id="thickness" min="0.1" max="3" step="0.1" value="1.0" />
      </div>

      <fieldset class="display-options">
        <legend>Display</legend>
        <label><input type="checkbox" id="show-barrier" checked /> Potential barrier</label>
        <label><input type="checkbox" id="show-real" checked /> Re[Ψ]</label>
        <label><input type="checkbox" id="show-imag" checked /> Im[Ψ]</label>
        <label><input type="checkbox" id="show-envelope" checked /> |Ψ|</label>
        <label><input type="checkbox" id="show-incident" /> Incident component</label>
        <label><input type="checkbox" id="show-reflected" /> Reflected component</label>
        <label><input type="checkbox" id="show-transmitted" /> Transmitted component</label>
      </fieldset>
    </section>

    <section class="stats" aria-label="Scattering observables">
      <span>Transmission T = <strong id="transmission-display">0</strong></span>
      <span>Reflection R = <strong id="reflection-display">0</strong></span>
    </section>

    <section class="plot-panel">
      <div id="plot"></div>
    </section>

    <footer>Rectangular barrier · stationary-state solution · boundary-matched wavefunction</footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
